<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROLE DE EQUIPAMENTO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Calibri, Arial, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }

        .app-header {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white; padding: 16px 28px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .app-title { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
        .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .update-field {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.15); border-radius: 8px;
            padding: 6px 14px;
        }
        .update-field label { font-size: 12px; font-weight: 600; }
        .update-field input[type="date"], .update-field input[type="time"] {
            border: none; border-radius: 4px; padding: 4px 8px; font-size: 13px;
            background: white; color: #333;
        }

        .main-container { max-width: 1440px; margin: 16px auto; padding: 0 14px; }

        /* Summary Cards */
        .summary-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .summary-card {
            flex: 1; min-width: 150px;
            background: white; border-radius: 10px;
            padding: 14px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            border-left: 4px solid;
        }
        .summary-card.green { border-left-color: #92D050; }
        .summary-card.gray { border-left-color: #7F7F7F; }
        .summary-card.red { border-left-color: #C62828; }
        .summary-card.blue { border-left-color: #1a237e; }
        .summary-card h3 { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .summary-card .value { font-size: 26px; font-weight: 700; }
        .summary-card.green .value { color: #2E7D32; }
        .summary-card.gray .value { color: #555; }
        .summary-card.red .value { color: #C62828; }
        .summary-card.blue .value { color: #1a237e; }

        /* Tabs */
        .tabs {
            display: flex; gap: 3px; margin-bottom: 12px;
            background: white; border-radius: 10px; padding: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        .tab-btn {
            padding: 9px 16px; border: none; background: transparent;
            cursor: pointer; font-size: 12px; font-weight: 600; color: #666;
            border-radius: 8px; white-space: nowrap; transition: all 0.2s;
        }
        .tab-btn:hover { background: #e8eaf6; color: #1a237e; }
        .tab-btn.active { background: #1a237e; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Section */
        .section {
            background: white; border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 16px; overflow: hidden;
        }
        .section-header {
            background: #1a237e; color: white;
            padding: 10px 18px; font-size: 13px; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center;
        }
        .section-header .count { font-size: 11px; opacity: 0.85; }

        /* Table */
        .eq-table { width: 100%; border-collapse: collapse; }
        .eq-table thead th {
            background: #e8eaf6; color: #1a237e;
            padding: 8px 12px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            text-align: left; border-bottom: 2px solid #c5cae9;
            position: sticky; top: 0;
        }
        .eq-table tbody tr { border-bottom: 1px solid #eee; transition: background 0.15s; }
        .eq-table tbody tr:hover { background: #f8f8ff; }
        .eq-table td { padding: 6px 12px; font-size: 12px; }
        .eq-table td.id-col { font-weight: 600; color: #333; white-space: nowrap; min-width: 60px; }

        /* Location dropdown */
        .loc-select {
            width: 100%; max-width: 280px; padding: 4px 6px;
            border: 1px solid #d0d0d0; border-radius: 6px; font-size: 12px;
            background: white; cursor: pointer; transition: border-color 0.2s;
            font-weight: 600;
        }
        .loc-select:focus { border-color: #1a237e; outline: none; box-shadow: 0 0 0 2px rgba(26,35,126,0.2); }

        /* Search results */
        .search-info {
            font-size: 12px; color: #1a237e; font-weight: 600; white-space: nowrap;
        }
        .btn-clear {
            background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px;
            padding: 7px 12px; font-size: 12px; color: #555; cursor: pointer;
        }
        .btn-clear:hover { background: #e8eaf6; color: #1a237e; }
        .sec-tag {
            display: inline-block; background: #e8eaf6; color: #1a237e;
            padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700;
        }
        .no-result { padding: 26px; text-align: center; color: #999; font-size: 13px; }

        /* Buttons */
        .btn-delete {
            background: transparent; border: 1px solid #e0e0e0; border-radius: 5px;
            padding: 3px 8px; font-size: 11px; color: #aaa; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #ffebee; color: #c62828; border-color: #ef9a9a; }

        /* Summary sub-table */
        .summary-table { width: 100%; border-collapse: collapse; }
        .summary-table th {
            background: #e8eaf6; color: #1a237e; padding: 7px 10px;
            font-size: 11px; font-weight: 700; text-align: center;
        }
        .summary-table td {
            padding: 5px 10px; font-size: 12px; text-align: center;
            border-bottom: 1px solid #eee;
        }
        .summary-table td:first-child { text-align: left; font-weight: 600; }
        .num-giro { color: #2E7D32; font-weight: 700; }
        .num-oficina { color: #555; font-weight: 700; }
        .num-fora { color: #C62828; font-weight: 700; }

        /* Resumo Tab */
        .resumo-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }
        .resumo-card {
            background: white; border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden;
        }
        .resumo-card-header {
            background: #1a237e; color: white; padding: 10px 16px;
            font-size: 12px; font-weight: 600;
        }
        .resumo-card-body { padding: 0; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white; border-radius: 14px; padding: 24px;
            width: 90%; max-width: 440px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease-out;
        }
        @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } }
        .modal h2 { font-size: 16px; margin-bottom: 16px; color: #1a237e; }
        .modal label { display: block; font-size: 11px; font-weight: 600; color: #666; margin-bottom: 3px; margin-top: 10px; }
        .modal input, .modal select {
            width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 13px;
        }
        .modal input:focus, .modal select:focus { border-color: #1a237e; outline: none; box-shadow: 0 0 0 2px rgba(26,35,126,0.2); }
        .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
        .btn-save { background: #1a237e; color: white; border: none; border-radius: 7px; padding: 9px 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-save:hover { background: #283593; }
        .btn-cancel { background: #f5f5f5; color: #666; border: 1px solid #ddd; border-radius: 7px; padding: 9px 16px; font-size: 13px; cursor: pointer; }

        /* Search bar */
        .search-bar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .search-input {
            flex: 1; max-width: 340px; padding: 8px 14px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 12px;
        }
        .search-input:focus { border-color: #1a237e; outline: none; box-shadow: 0 0 0 2px rgba(26,35,126,0.15); }

        /* Floating Add Button */
        .fab {
            position: fixed; bottom: 22px; right: 22px;
            width: 52px; height: 52px; border-radius: 50%;
            background: #1a237e; color: white; border: none; font-size: 26px;
            cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            z-index: 100; transition: transform 0.2s;
        }
        .fab:hover { transform: scale(1.1); }

        /* Responsive */
        @media (max-width: 768px) {
            .app-header { padding: 10px 12px; }
            .app-title { font-size: 15px; }
            .main-container { padding: 0 6px; }
            .loc-select { max-width: 160px; font-size: 11px; }
            .eq-table td { padding: 4px 6px; font-size: 11px; }
            .tabs { gap: 2px; }
            .tab-btn { padding: 7px 10px; font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="app-title">⚙ CONTROLE DE EQUIPAMENTO</div>
    <div class="header-right">
        <div class="update-field">
            <label>📅 Data de Atualização:</label>
            <input type="date" id="updateDate" onchange="saveData()" />
            <input type="time" id="updateTime" onchange="saveData()" step="60" />
        </div>
    </div>
</div>

<div class="main-container">
    <div class="summary-row" id="summaryCards"></div>
    <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Digite o ID do equipamento ou a localização..." oninput="filterAll()" />
        <button class="btn-clear" onclick="clearSearch()">Limpar</button>
        <span class="search-info" id="searchInfo"></span>
    </div>
    <div id="searchResults" style="display:none"></div>
    <div class="tabs" id="tabBar">
        <button class="tab-btn active" data-key="resumo" onclick="switchTab('resumo')">📊 Resumo</button>
        <button class="tab-btn" data-key="cacamba" onclick="switchTab('cacamba')">Caçamba 5/6M³</button>
        <button class="tab-btn" data-key="comp7" onclick="switchTab('comp7')">Grimaldi 7M³</button>
        <button class="tab-btn" data-key="comp17" onclick="switchTab('comp17')">Grimaldi 17M³</button>
        <button class="tab-btn" data-key="comp20" onclick="switchTab('comp20')">Grimaldi 20M³</button>
        <button class="tab-btn" data-key="migra" onclick="switchTab('migra')">Migra 17M³</button>
        <button class="tab-btn" data-key="cp17stell" onclick="switchTab('cp17stell')">CP 17M³ Stell</button>
        <button class="tab-btn" data-key="cacamba39" onclick="switchTab('cacamba39')">Caçamba 39M³</button>
    </div>
    <div class="tab-content active" id="tab-resumo"></div>
    <div class="tab-content" id="tab-cacamba"></div>
    <div class="tab-content" id="tab-comp7"></div>
    <div class="tab-content" id="tab-comp17"></div>
    <div class="tab-content" id="tab-comp20"></div>
    <div class="tab-content" id="tab-migra"></div>
    <div class="tab-content" id="tab-cp17stell"></div>
    <div class="tab-content" id="tab-cacamba39"></div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h2>Adicionar Equipamento</h2>
        <label>Seção</label>
        <select id="modalSection"></select>
        <label>ID / Nome do Equipamento</label>
        <input type="text" id="modalEquipId" placeholder="Ex: 540, CP20, 01F..." />
        <label>Localização / Status</label>
        <select id="modalLocation"></select>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-save" onclick="saveNewEquip()">Salvar</button>
        </div>
    </div>
</div>

<button class="fab" onclick="openAddModal()">+</button>

// DATA — exact copy from spreadsheet
let DATA = {

// PERSISTENCE
function saveData() {
    localStorage.setItem('ce_data', JSON.stringify(DATA));
    localStorage.setItem('ce_date', document.getElementById('updateDate').value);
    localStorage.setItem('ce_time', document.getElementById('updateTime').value);
}
function loadData() {
    const d = localStorage.getItem('ce_data');
    if (d) { try { DATA = JSON.parse(d); } catch(e){} }
    const dt = localStorage.getItem('ce_date');
    const tm = localStorage.getItem('ce_time');
    if (dt) document.getElementById('updateDate').value = dt;
    if (tm) document.getElementById('updateTime').value = tm;
}

// HELPERS
function getLocColor(loc) {
    if (LOC_COLORS[loc]) return LOC_COLORS[loc];
    for (const key of Object.keys(LOC_COLORS)) { if (loc && loc.includes(key)) return LOC_COLORS[key]; }
    return '#e0e0e0';
}
function getLocTextColor(loc) {
    return LIGHT_BG_LOCS.includes(loc) ? '#333' : '#fff';
}
function countStatus(items) {
    let giro=0, oficina=0, fora=0;
    items.forEach(i => {
        if (i.loc==='GIRO') giro++;
        else if (i.loc==='OFICINA') oficina++;
        else if (i.loc==='FORA DE OPERAÇÃO') fora++;
    });
    return { giro, oficina, fora, total: items.length };
}
function getAllItems() {
    let all = [];
    Object.keys(SECTIONS).forEach(k => DATA[k].forEach(i => all.push({...i, section:k})));
    return all;
}

// RENDER Summary Cards
function renderSummaryCards() {
    const all = getAllItems();
    const c = countStatus(all);
    document.getElementById('summaryCards').innerHTML = `
        <div class="summary-card green"><h3>Em Giro</h3><div class="value">${c.giro}</div></div>
        <div class="summary-card gray"><h3>Oficina</h3><div class="value">${c.oficina}</div></div>
        <div class="summary-card red"><h3>Fora de Operação</h3><div class="value">${c.fora}</div></div>
        <div class="summary-card blue"><h3>Total</h3><div class="value">${c.total}</div></div>
    `;
}

// RENDER Resumo Tab
function renderResumo() {
    const sections = Object.keys(SECTIONS);
    let cardsHtml = '';
    sections.forEach(k => {
        const items = DATA[k] || [];
        const c = countStatus(items);
        cardsHtml += `
        <div class="resumo-card">
            <div class="resumo-card-header">${SECTIONS[k].title}</div>
            <div class="resumo-card-body">
                <table class="summary-table">
                    <thead><tr><th>Giros</th><th>Oficina</th><th>Fora Op.</th><th>Total</th></tr></thead>
                    <tbody><tr>
                        <td class="num-giro">${c.giro}</td>
                        <td class="num-oficina">${c.oficina}</td>
                        <td class="num-fora">${c.fora}</td>
                        <td style="font-weight:700">${c.total}</td>
                    </tr></tbody>
                </table>
            </div>
        </div>`;
    });
    document.getElementById('tab-resumo').innerHTML = `<div class="resumo-grid">${cardsHtml}</div>`;
}

// RENDER Section Table
function renderSection(key) {
    const sec = SECTIONS[key];
    const items = DATA[key] || [];
    const c = countStatus(items);

    let html = `<div class="section">
        <div class="section-header">
            <span>${sec.title}</span>
            <span class="count">Giro: ${c.giro} | Oficina: ${c.oficina} | Fora: ${c.fora} | Total: ${c.total}</span>
        </div>
        <table class="eq-table">
        <thead><tr><th>ID / Equipamento</th><th>Localização / Status</th>`;
    html += `<th style="width:50px"></th></tr></thead><tbody>`;

    items.forEach((item, idx) => {
        const bg = getLocColor(item.loc);
        const tc = getLocTextColor(item.loc);
        html += `<tr data-idx="${idx}" data-section="${key}">
            <td class="id-col">${item.id}</td>
            <td><select class="loc-select" onchange="updateLoc('${key}',${idx},this.value)" style="background-color:${bg};color:${tc}">
                <option value="">-- Selecionar --</option>`;
        LOCATIONS.forEach(loc => {
            const sel = loc === item.loc ? 'selected' : '';
            html += `<option value="${loc}" ${sel}>${loc}</option>`;
        });
        html += `</select></td>`;
        html += `<td><button class="btn-delete" onclick="deleteItem('${key}',${idx})">✕</button></td></tr>`;
    });

    html += `</tbody></table>
    <table class="summary-table" style="margin-top:0">
        <thead><tr><th>Resumo</th><th>Giros</th><th>Oficina</th><th>Fora Operação</th></tr></thead>
        <tbody><tr>
            <td style="font-size:11px">${sec.title}</td>
            <td class="num-giro">${c.giro}</td>
            <td class="num-oficina">${c.oficina}</td>
            <td class="num-fora">${c.fora}</td>
        </tr></tbody>
    </table></div>`;
    document.getElementById('tab-' + key).innerHTML = html;
}

function renderAll() {
    Object.keys(SECTIONS).forEach(k => renderSection(k));
    renderResumo();
    renderSummaryCards();
}

// ACTIONS
function updateLoc(section, idx, val) {
    DATA[section][idx].loc = val;
    saveData(); renderAll(); setUpdateTimestamp();
    if (document.getElementById('searchInput').value.trim()) filterAll();
}
function deleteItem(section, idx) {
    if (confirm('Confirma excluir este equipamento?')) {
        DATA[section].splice(idx, 1);
        saveData(); renderAll(); setUpdateTimestamp();
        if (document.getElementById('searchInput').value.trim()) filterAll();
    }
}
function setUpdateTimestamp() {
    const now = new Date();
    document.getElementById('updateDate').value = now.toISOString().split('T')[0];
    document.getElementById('updateTime').value = now.toTimeString().slice(0,5);
    saveData();
}

// MODAL
function openAddModal() {
    const sel = document.getElementById('modalSection');
    sel.innerHTML = '';
    Object.keys(SECTIONS).forEach(k => {
        const opt = document.createElement('option'); opt.value = k; opt.textContent = SECTIONS[k].title;
        sel.appendChild(opt);
    });
    const locSel = document.getElementById('modalLocation');
    locSel.innerHTML = '<option value="">-- Selecionar --</option>';
    LOCATIONS.forEach(loc => {
        const opt = document.createElement('option'); opt.value = loc; opt.textContent = loc;
        locSel.appendChild(opt);
    });
    document.getElementById('modalEquipId').value = '';
    document.getElementById('addModal').classList.add('show');
}
function closeModal() { document.getElementById('addModal').classList.remove('show'); }
function saveNewEquip() {
    const section = document.getElementById('modalSection').value;
    const equipId = document.getElementById('modalEquipId').value.trim();
    const loc = document.getElementById('modalLocation').value;
    if (!equipId || !loc) { alert('Preencha o ID e a Localização!'); return; }
    const newItem = { id: equipId, loc };
    DATA[section].push(newItem);
    saveData(); renderAll(); closeModal(); setUpdateTimestamp();
    switchTab(section);
}

// TABS
function switchTab(key) {
    document.getElementById('searchInput').value = '';
    const panel = document.getElementById('searchResults');
    panel.style.display = 'none'; panel.innerHTML = '';
    document.getElementById('searchInfo').textContent = '';
    document.getElementById('tabBar').style.display = '';
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = '');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    const tabEl = document.getElementById('tab-' + key);
    if (tabEl) tabEl.classList.add('active');
    const btn = document.querySelector(`.tab-btn[data-key="${key}"]`);
    if (btn) btn.classList.add('active');
}

// SEARCH — busca global por ID do equipamento ou localização
function normalize(s) {
    return (s === undefined || s === null ? '' : String(s))
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
}

function searchItems(q) {
    const nq = normalize(q);
    const exact = [], starts = [], partial = [], byLoc = [];
    Object.keys(SECTIONS).forEach(key => {
        (DATA[key] || []).forEach((item, idx) => {
            const nid = normalize(item.id);
            const nloc = normalize(item.loc);
            const rec = { key, idx, item };
            if (nid === nq) exact.push(rec);
            else if (nid.startsWith(nq)) starts.push(rec);
            else if (nid.includes(nq)) partial.push(rec);
            else if (nloc.includes(nq)) byLoc.push(rec);
        });
    });
    return exact.concat(starts, partial, byLoc);
}

function filterAll() {
    const raw = document.getElementById('searchInput').value;
    const q = raw.trim();
    const panel = document.getElementById('searchResults');
    const info = document.getElementById('searchInfo');
    const tabBar = document.getElementById('tabBar');

    if (!q) {
        panel.style.display = 'none';
        panel.innerHTML = '';
        info.textContent = '';
        tabBar.style.display = '';
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = '');
        return;
    }

    const results = searchItems(q);
    tabBar.style.display = 'none';
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    panel.style.display = 'block';
    info.textContent = results.length + (results.length === 1 ? ' resultado' : ' resultados');

    if (!results.length) {
        panel.innerHTML = `<div class="section">
            <div class="section-header"><span>RESULTADO DA BUSCA</span></div>
            <div class="no-result">Nenhum equipamento encontrado para "${escapeHtml(q)}".</div>
        </div>`;
        return;
    }

    let rows = '';
    results.forEach(r => {
        const bg = getLocColor(r.item.loc);
        const tc = getLocTextColor(r.item.loc);
        let opts = '<option value="">-- Selecionar --</option>';
        LOCATIONS.forEach(loc => {
            opts += `<option value="${loc}" ${loc === r.item.loc ? 'selected' : ''}>${loc}</option>`;
        });
        rows += `<tr>
            <td class="id-col">${escapeHtml(r.item.id)}</td>
            <td><span class="sec-tag">${SECTIONS[r.key].title}</span></td>
            <td><select class="loc-select" onchange="updateLoc('${r.key}',${r.idx},this.value)" style="background-color:${bg};color:${tc}">${opts}</select></td>
        </tr>`;
    });

    panel.innerHTML = `<div class="section">
        <div class="section-header">
            <span>RESULTADO DA BUSCA: "${escapeHtml(q)}"</span>
            <span class="count">${results.length} encontrado(s)</span>
        </div>
        <table class="eq-table">
            <thead><tr><th>ID / Equipamento</th><th>Seção</th><th>Localização / Status</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>
    </div>`;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    filterAll();
}

// INIT
function init() {
    loadData();
    if (!document.getElementById('updateDate').value) {
        document.getElementById('updateDate').value = '2026-08-13';
        document.getElementById('updateTime').value = '15:55';
    }
    renderAll();
}
init();
</script>
